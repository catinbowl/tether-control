[package]
name = "tether-control"
version = "0.1.0"
edition = "2024"
description = "LAN KVM controller using a macOS virtual external display mapped 1:1 to a Linux physical display"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
mdns-sd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSObject",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextField",
    "NSView",
    "NSWorkspace",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"

